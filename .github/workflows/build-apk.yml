name: Build All APKs (Store + Rider + Vendor)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json
        run: |
          python3 -c "
          import json
          data = {
            'project_info': {
              'project_number': '000000000000',
              'project_id': 'harivas-app',
              'storage_bucket': 'harivas-app.appspot.com'
            },
            'client': [
              {
                'client_info': {
                  'mobilesdk_app_id': '1:000000000000:android:0000000000000001',
                  'android_client_info': {'package_name': 'com.harivas.app.store'}
                },
                'oauth_client': [],
                'api_key': [{'current_key': 'dummy'}],
                'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              },
              {
                'client_info': {
                  'mobilesdk_app_id': '1:000000000000:android:0000000000000002',
                  'android_client_info': {'package_name': 'com.harivas.app.rider'}
                },
                'oauth_client': [],
                'api_key': [{'current_key': 'dummy'}],
                'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              },
              {
                'client_info': {
                  'mobilesdk_app_id': '1:000000000000:android:0000000000000003',
                  'android_client_info': {'package_name': 'com.harivas.app.vendor'}
                },
                'oauth_client': [],
                'api_key': [{'current_key': 'dummy'}],
                'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              }
            ],
            'configuration_version': '1'
          }
          with open('app/google-services.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('google-services.json created with 3 clients')
          "

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Build all 3 Debug APKs
        run: ./gradlew assembleStoreDebug assembleRiderDebug assembleVendorDebug --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      - name: Upload Store APK
        uses: actions/upload-artifact@v4
        with:
          name: HARIVAS-Store-APK
          path: app/build/outputs/apk/store/debug/app-store-debug.apk
          retention-days: 30

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: HARIVAS-Rider-APK
          path: app/build/outputs/apk/rider/debug/app-rider-debug.apk
          retention-days: 30

      - name: Upload Vendor APK
        uses: actions/upload-artifact@v4
        with:
          name: HARIVAS-Vendor-APK
          path: app/build/outputs/apk/vendor/debug/app-vendor-debug.apk
          retention-days: 30
