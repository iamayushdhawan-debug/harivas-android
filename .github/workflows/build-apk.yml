name: Build All 5 APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Create google-services.json (all 5 package names)
        run: |
          python3 -c "
          import json
          pkgs = ['store','rider','vendor','staff','admin']
          clients = []
          for i, p in enumerate(pkgs):
              clients.append({
                'client_info': {
                  'mobilesdk_app_id': f'1:000000000000:android:00000000000000{i+1:02d}',
                  'android_client_info': {'package_name': f'com.harivas.app.{p}'}
                },
                'oauth_client': [],
                'api_key': [{'current_key': 'dummy'}],
                'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              })
          data = {
            'project_info': {
              'project_number': '000000000000',
              'project_id': 'harivas-app',
              'storage_bucket': 'harivas-app.appspot.com'
            },
            'client': clients,
            'configuration_version': '1'
          }
          with open('app/google-services.json','w') as f:
              json.dump(data, f, indent=2)
          print('Created google-services.json with 5 clients')
          "

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.7 --distribution-type=bin
          chmod +x gradlew

      - name: Build all 5 Debug APKs
        run: |
          ./gradlew assembleStoreDebug \
                    assembleRiderDebug \
                    assembleVendorDebug \
                    assembleStaffDebug \
                    assembleAdminDebug \
                    --no-daemon --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.daemon=false"

      - name: Upload Store APK
        uses: actions/upload-artifact@v4
        with:
          name: "🛒 HARIVAS-Store"
          path: app/build/outputs/apk/store/debug/app-store-debug.apk
          retention-days: 30

      - name: Upload Rider APK
        uses: actions/upload-artifact@v4
        with:
          name: "🛵 HARIVAS-Rider"
          path: app/build/outputs/apk/rider/debug/app-rider-debug.apk
          retention-days: 30

      - name: Upload Vendor APK
        uses: actions/upload-artifact@v4
        with:
          name: "🏪 HARIVAS-Vendor"
          path: app/build/outputs/apk/vendor/debug/app-vendor-debug.apk
          retention-days: 30

      - name: Upload Staff APK
        uses: actions/upload-artifact@v4
        with:
          name: "👷 HARIVAS-Staff"
          path: app/build/outputs/apk/staff/debug/app-staff-debug.apk
          retention-days: 30

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: "🔧 HARIVAS-Admin"
          path: app/build/outputs/apk/admin/debug/app-admin-debug.apk
          retention-days: 30
